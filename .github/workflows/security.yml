# Security and test pipeline. Runs on every push and pull request.
# Uses only mock providers and throwaway databases — no production secrets are needed or used.
name: security

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  # Make sure nothing in CI can reach a real provider.
  DEMO_MODE: "true"
  PAYMENT_PROVIDER: mock
  MESSAGING_PROVIDER: mock
  OTP_PROVIDER: mock

jobs:
  unit:
    name: Unit / integration / security (Vitest, PGlite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  concurrency:
    name: Concurrency + full suite on real Postgres 17
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bba_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/bba_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - run: npm ci
      - run: npm run test:concurrency
      - run: npm run test:realdb

  e2e:
    name: Playwright (e2e + HTTP security)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: playwright-traces, path: test-results/, retention-days: 7 }

  secrets:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git --redact --verbose --report-format sarif --report-path gitleaks.sarif .
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: gitleaks, path: gitleaks.sarif, if-no-files-found: ignore }

  sast:
    name: Semgrep (fails on ERROR)
    runs-on: ubuntu-latest
    container: { image: semgrep/semgrep }
    steps:
      - uses: actions/checkout@v4
      - run: >-
          semgrep scan --config p/nextjs --config p/typescript --config p/secrets --config p/owasp-top-ten
          --severity ERROR --error --sarif --output semgrep.sarif
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: semgrep, path: semgrep.sarif, if-no-files-found: ignore }

  audit:
    name: npm audit (production deps, high+)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - run: npm audit --omit=dev --audit-level=high

  zap:
    name: OWASP ZAP baseline (against a local build)
    runs-on: ubuntu-latest
    needs: [unit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - run: npm ci
      - name: Start the app (mock providers, embedded DB, port 3100)
        run: |
          nohup node scripts/e2e-server.mjs > server.log 2>&1 &
          npx --yes wait-on -t 300000 http://localhost:3100
      - name: ZAP baseline
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: http://localhost:3100
          rules_file_name: .zap/rules.tsv
          cmd_options: "-a -j"
          allow_issue_writing: false
          artifact_name: zap-report
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: zap-server-log, path: server.log, if-no-files-found: ignore }
